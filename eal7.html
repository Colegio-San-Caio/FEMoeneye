<!DOCTYPE html>
<html>
<head><title>eal7.x FLOP QUADRUPLE 8038</title>
<style>body{font-family:monospace;background:#000;color:#0f0;padding:20px}pre{background:#111;padding:15px;border:1px solid #0f0}#bar{display:flex;gap:4px;height:100px;align-items:end} .b{background:#0f0;width:30px}</style>
</head>
<body>
<h1>eal7.x MAIN MACHINE CODE - 8038 FLOP QUADRUPLE PERSISTENT</h1>
<div>BOA: application/vnd.x-mosfetq-dos-image IANA:1460172</div>
<div id="info"></div>
<div id="bar"></div>
<pre id="m">loading...</pre>
<script src="/oenlytics.js"></script>
<script>
function load(){
 fetch('/matrix').then(r=>r.json()).then(d=>{
   document.getElementById('m').textContent=JSON.stringify(d,null,2);
   document.getElementById('info').innerHTML=`DB: ${d.db} | Total: ${d.total} | Flops: ${d.total_flops_quadruple} | Port: ${d.port}`;
   let bar=document.getElementById('bar'); bar.innerHTML='';
   Object.entries(d.matrix||{}).forEach(([page,evs])=>{
     Object.entries(evs).forEach(([ev,count])=>{
       let div=document.createElement('div'); div.className='b';
       div.style.height=(count*20+10)+'px'; div.title=`${page} ${ev} ${count}`;
       bar.appendChild(div);
     })
   })
 });
}
setInterval(load,1000); load();
oenLytics.track('ximg_view');
</script>
</body>
</html>
